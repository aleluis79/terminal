[workspace]
resolver = "2"
members = [
    "terminal_core",
    "terminal_config",
    "terminal_pty",
    "terminal_render",
    "terminal_gui",
    "terminal",
]

# Configurar cargo para todos los crates del workspace
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Permitir algunos que son demasiado estrictos por defecto
must_use_candidate = "allow"
cast_possible_truncation = "allow"

[workspace.lints.rust]
warnings = "deny"
missing_docs = "warn"

# Dependencias comunes del workspace
[workspace.dependencies]
# Serialización
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Async
tokio = { version = "1", features = ["full"] }

# Testing
rstest = "0.23"

# Platform
nix = { version = "0.29", features = ["process", "term", "signal", "ioctl"] }
bytemuck = "1"

# GUI / Rendering
winit = { version = "0.30", features = ["serde"] }
wgpu = "23"
fontdb = "0.22"
swash = "0.1"

# Clipboard (MIT OR Apache-2.0)
# `wayland-data-control` enables native Wayland support; without it arboard
# only talks to X11, which breaks on pure Wayland sessions.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
